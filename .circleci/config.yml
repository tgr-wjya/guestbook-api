version: 2.1

orbs:
  codecov: codecov/codecov@5.4.3

jobs:
  test-and-scan:
    docker:
      - image: oven/bun:1.3.10
    steps:
      - checkout

      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}

      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile

      - save_cache:
          key: bun-deps-{{ checksum "bun.lock" }}
          paths:
            - node_modules

      - run:
          name: Run tests with coverage
          command: bun test --coverage

      - codecov/upload:
          files: ./coverage/lcov.info

      - restore_cache:
          keys:
            - sonar-scanner-6.2.1.4610

      - run:
          name: Install Sonar Scanner
          command: |
            if [ ! -f /opt/sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner ]; then
              apt-get update && apt-get install -y curl unzip
              curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
              unzip sonar-scanner.zip -d /opt
            fi
            ln -sf /opt/sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner /usr/local/bin/sonar-scanner

      - save_cache:
          key: sonar-scanner-6.2.1.4610
          paths:
            - /opt/sonar-scanner-6.2.1.4610-linux-x64

      - run:
          name: Run SonarCloud Scan
          command: sonar-scanner -Dsonar.token=$SONAR_TOKEN

workflows:
  ci:
    jobs:
      - test-and-scan
