version: 2.1

jobs:
  test:
    docker:
      - image: oven/bun:1.3.10
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
            - bun-deps-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
            - node_modules
      - run:
          name: Run tests with coverage
          command: bun test --coverage
      - run:
          name: Upload coverage to Codecov
          command: |
            apt-get update && apt-get install -y curl
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov -f ./coverage/lcov.info -t ${CODECOV_TOKEN} -Z

  sonarcloud_scan:
    docker:
      - image: oven/bun:1.3.10
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
            - bun-deps-
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Run tests for coverage
          command: bun test --coverage
      - run:
          name: Install SonarScanner CLI
          command: |
            apt-get update && apt-get install -y curl unzip
            rm -f sonar-scanner.zip
            curl --fail --location --show-error --silent \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --output sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-6.2.1.4610-linux-x64.zip
            unzip -tq sonar-scanner.zip
            unzip -q sonar-scanner.zip
      - run:
          name: Run SonarCloud scan
          command: |
            ./sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${SONAR_TOKEN}

workflows:
  version: 2
  ci:
    jobs:
      - test
      - sonarcloud_scan:
          requires:
            - test
